<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">Devasy Sharma</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="project.html">Projects</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content Section -->
    <main class="hero-section">
        <div class="contact-container">
            
            <!-- Left Column: Text & Info -->
            <div class="contact-text">
                <p class="overline">GET IN TOUCH</p>
                <h1 class="main-headline">
                    Let's build something <br>
                    <span class="highlight">great</span> together.
                </h1>
                <p class="sub-headline">
                    Whether you have a question, a project idea, or just want to say hi, my inbox is always open. I'll try my best to get back to you!
                </p>

                <div class="contact-details">
                    <div class="contact-item">
                        <span class="contact-label">EMAIL</span>
                        <a href="mailto:hello@devasysharma.com" class="contact-link">hello@devasysharma.com</a>
                    </div>
                    <div class="contact-item">
                        <span class="contact-label">SOCIALS</span>
                        <div class="social-links">
                            <a href="#" aria-label="LinkedIn">
                                <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
                                    <path d="M6.5 8.5H3V21h3.5V8.5ZM4.75 3A2.05 2.05 0 1 0 4.75 7.1 2.05 2.05 0 0 0 4.75 3ZM21 13.85c0-3.76-2-5.51-4.67-5.51-2.15 0-3.11 1.18-3.65 2v-1.84H9.2V21h3.48v-6.19c0-1.63.31-3.21 2.33-3.21 1.99 0 2.02 1.86 2.02 3.31V21H21v-7.15Z"/>
                                </svg>
                            </a>
                            <a href="#" aria-label="X">
                                <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
                                    <path d="M18.9 2H22l-6.77 7.74L23.2 22h-6.24l-4.89-6.39L6.48 22H3.37l7.24-8.28L3 2h6.4l4.42 5.84L18.9 2Zm-1.1 17.85h1.73L8.47 4.03H6.61L17.8 19.85Z"/>
                                </svg>
                            </a>
                            <a href="#" aria-label="GitHub">
                                <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
                                    <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.18-3.37-1.18-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02A9.57 9.57 0 0 1 12 7.85c.85 0 1.71.11 2.51.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: Form -->
           
            <div class="contact-form-container">
                <form id="portfolio-form" class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Jane Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="jane@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="How can I help you?" required></textarea>
                    </div>
                    <!-- Added an ID to the button to change text during loading -->
                    <button type="submit" id="submit-btn" class="btn primary-btn submit-btn">Send Message</button>
                    
                    <!-- Feedback message div -->
                    <p id="form-feedback" style="display: none; margin-top: 1rem; font-size: 0.85rem; font-weight: 600; text-align: center;"></p>
                </form>
            </div>

        </div>
    </main>

    <!-- Footer Bar -->
    <footer class="footer-bar"></footer>
<!-- Script to handle form submission -->
    <script>
        document.getElementById('portfolio-form').addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevents the page from refreshing

            const submitBtn = document.getElementById('submit-btn');
            const feedbackText = document.getElementById('form-feedback');
            
            // Get values from the form
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            // UI Loading state
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;
            feedbackText.style.display = 'none';

            try {
                // Send data to your Node.js backend
                const response = await fetch('http://localhost:3000/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, message })
                });

                const data = await response.json();

                if (response.ok) {
                    feedbackText.textContent = 'Message sent successfully!';
                    feedbackText.style.color = '#28a745';
                    feedbackText.style.display = 'block';
                    this.reset(); // Clear the form
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                feedbackText.textContent = 'Failed to send message. Make sure the backend server is running.';
                feedbackText.style.color = '#dc3545';
                feedbackText.style.display = 'block';
                console.error(error);
            } finally {
                // Reset button UI
                submitBtn.textContent = 'Send Message';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
